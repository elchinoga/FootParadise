name: Actualizar noticias desde Twitter

# Desde 2026-10 X (Cloudflare) bloquea a los servidores de GitHub, asi que ya no corre solo:
# la actualizacion diaria la hace una tarea programada en la PC de Gus
# (F:\00_CLAUDE\Noticias_FootParadise). Queda para correrlo a mano si X lo vuelve a permitir.
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # necesario para hacer el commit

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar gallery-dl
        run: pip install gallery-dl

      - name: Correr script
        env:
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
        run: python scripts/update_news.py

      - name: Commit y push (si hay cambios)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json imagenes/
          git diff --cached --quiet || git commit -m "chore: actualiza noticias $(date +'%Y-%m-%d')"
          git push
